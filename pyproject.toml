[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar2midi"
version = "0.1.0"
description = "Visual guitar transcription: silent video to MIDI"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "pretty_midi",
    "mir_eval",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]
# GuiFiR dataset download (gdown archive, yt-dlp clips)
data = ["gdown", "yt-dlp"]
# corner annotation GUI (01b): keeps the OpenCV window on top under X11
annotate = ["python-xlib"]

[tool.setuptools.packages.find]
where = ["src"]
